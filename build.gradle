buildscript {
    repositories {
        mavenCentral()
    }
}

plugins {
    id 'base'
    id 'groovy'
    id 'idea'
    id 'maven-publish' // to use maven repository
    id 'io.github.ben-manes.versions' version '0.61.0'
    // gradle dependencyUpdates -Drevision=release  --refresh-dependencies
}

def runtimeJavaVersion = JavaVersion.current()
def java8Compatibility = runtimeJavaVersion == JavaVersion.VERSION_1_8
def requestedGroovyVersion = findProperty('groovyVersion')
def effectiveGroovyVersion = java8Compatibility
        ? (requestedGroovyVersion ?: '4.0.33')
        : project.groovyVersion
def groovy6Compatibility = effectiveGroovyVersion.startsWith('6.')
def xmlsecVersion = java8Compatibility ? '3.0.3' : '4.0.4'
def testngVersion = java8Compatibility ? '7.5.1' : '7.12.0'
def logbackVersion = java8Compatibility ? '1.3.14' : '1.4.14'
def targetJavaVersion = java8Compatibility
        ? JavaVersion.VERSION_1_8
        : (groovy6Compatibility ? JavaVersion.VERSION_17 : JavaVersion.VERSION_11)

println "=== Build Configuration ==="
println "Gradle version: ${gradle.gradleVersion}"
println "Groovy version: ${effectiveGroovyVersion}"
println "Java runtime version: ${runtimeJavaVersion}"
println "Java target compatibility: ${targetJavaVersion}"
println "==========================="

def installDir = file('./install')

java {
    sourceCompatibility = targetJavaVersion
    targetCompatibility = targetJavaVersion
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.apache.groovy:groovy:${effectiveGroovyVersion}"
    implementation "org.apache.groovy:groovy-xml:${effectiveGroovyVersion}"
    implementation "org.apache.santuario:xmlsec:${xmlsecVersion}"
    implementation 'org.slf4j:slf4j-api:2.0.12'

    testImplementation "org.testng:testng:${testngVersion}"
    testImplementation "ch.qos.logback:logback-classic:${logbackVersion}"
    testImplementation 'org.codehaus.janino:janino:3.1.12'
}

jar {
    manifest {
        attributes(
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Specification-Vendor': project.author,
            'Built-By': project.author,
            'Specification-Title': project.name,
            'Extension-Name': project.name,
            'Specification-Version': project.version
        )
    }
}

clean.doLast {  //add to clean task
    installDir.deleteDir()
}

task groovydocJar(type: Jar, dependsOn: groovydoc) {
    archiveClassifier = 'groovydoc'
    from groovydoc.destinationDir
}

// gradle test
// to run specific test use e.g. gradle test --tests "com.github.novakmi.libeetlite.test.EetliteXmlTest.getPokTest"
// to run more tests use e.g. gradle test --tests "com.github.novakmi.libeetlite.test.EetliteXmlTest.getPokTest" --tests "com.github.novakmi.libeetlite.test.EetXmlV4Test.createsV4BodyWithoutLegacyCodes"
// one can use patterns in tests *, etc.
test {
    systemProperties["testDataDir"] = "${projectDir}/src/test/testData"
    systemProperties["schemaFile"] = "${projectDir}/info/EET2/EETXMLSchema.xsd"
    testLogging {
        // Zobrazí println i logy přímo v příkazové řádce
        showStandardStreams = true
        events "passed", "skipped", "failed", "standardOut", "standardError"
    }
    useTestNG() {
        suiteXmlBuilder().suite(name: 'Test libeetlite') {
            test(name: 'libeetlite'/*, annotations: 'JDK', verbose: '1'*/) {
                groups {
                    run {
                        include(name: "unit")
                        include(name: "local")
                    }
                }

                classes([:]) {
                    'class'(name: "com.github.novakmi.libeetlite.test.EetliteUtilTest")
                    'class'(name: "com.github.novakmi.libeetlite.test.EetliteXmlTest")
                    'class'(name: "com.github.novakmi.libeetlite.test.EetXmlV4Test")
                }
            }
        }
    }
    //options {
    //        listeners << 'org.uncommons.reportng.HTMLReporter'
    //        listeners << 'org.uncommons.reportng.JUnitXMLReporter'
    //    }
}

// gradle internetTest
// gradle internetTest --tests "com.github.novakmi.libeetlite.test.EetXmlV4Test"
tasks.register('internetTest', Test) {
    description = 'Runs integration tests against the EET Playground.'
    group = 'verification'
    dependsOn testClasses
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperties["testDataDir"] = "${projectDir}/src/test/testData"
    systemProperties["schemaFile"] = "${projectDir}/info/EET2/EETXMLSchema.xsd"
    testLogging {
        showStandardStreams = true
        events "passed", "skipped", "failed", "standardOut", "standardError"
    }
    useTestNG() {
        suiteXmlBuilder().suite(name: 'Internet tests') {
            test(name: 'libeetlite-internet') {
                groups {
                    run {
                        include(name: "internet")
                    }
                }
                classes([:]) {
                    'class'(name: "com.github.novakmi.libeetlite.test.EetliteXmlTest")
                }
            }
        }
    }
}

task prepareInstall(type: Copy, dependsOn: [jar, sourcesJar, groovydocJar]) {
    installDir.mkdirs()
    //from configurations.compileClasspath.files // if we need also dependencies
    from "${project.projectDir}/build/libs"
    into installDir
}

// zip into build/distributions
task zipInstall(type: Zip, dependsOn: prepareInstall) {
    from installDir.toString()
}

publishing {   // use gradle publish
    def localMavenDir = System.getenv()['LOCAL_MAVEN_DIR']
    if (!localMavenDir) {
        logger.error("LOCAL_MAVEN_DIR is not defined! Artifacts will not be exported!")
    } else {
        publications {
            eetLiteLibrary(MavenPublication) {
                from components.java
                artifact groovydocJar
            }
        }
        repositories {
            maven {
                name = 'novakmirepo'
                url = "file://${localMavenDir}/releases"
            }
        }
    }
}
